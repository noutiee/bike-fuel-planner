
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <title>Bike Fuel Planner</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root{--brand:#0b57d0;--bg:#f6f7fb;--card:#ffffff;--ink:#0d1321;--muted:#64748b}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    header{padding:14px 16px;background:var(--brand);color:#fff;position:sticky;top:0}
    h1{font-size:1.125rem;margin:0}
    main{max-width:980px;margin:16px auto;padding:0 12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:720px){.grid{grid-template-columns:1fr}}
    fieldset{border:1px solid #e5e7eb;border-radius:10px;background:var(--card);padding:12px}
    legend{padding:0 6px;color:var(--muted)}
    label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
    label span{font-size:0.95rem}
    input[type=number]{width:100px;text-align:right;padding:8px;border:1px solid #c7d0e0;border-radius:8px}
    input[type=range]{flex:1}
    .inline{display:flex;gap:8px;align-items:center}
    button.primary{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:600;margin:16px 0;font-size:1.05rem}
    .ghost{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:10px;padding:10px 12px}
    details{border:1px dashed #cbd5e1;border-radius:10px;padding:10px;background:#fff}
  </style>
</head>
<body>
<header><h1>Bike Fuel Planner</h1></header>

<div style="margin:12px; display:flex; gap:8px; align-items:center;">
  <button class="ghost" id="btnSignIn" onclick="signIn()">Sign in with Google</button>
  <button class="ghost" id="btnSignOut" onclick="signOut()" style="display:none;">Sign out</button>
  <span id="signedInAs" style="color:#64748b;"></span>
  <button class="ghost" id="btnForcePull" type="button" style="margin-left:auto; display:none;">Force sync (pull)</button>
</div>

<main>
  <div class="grid">
    <fieldset>
      <legend>Swim</legend>
      <label><span>Duration (min)</span><div class="inline"><input id="swimMinutes" type="number" value="0"><input id="swimSlider" type="range" min="0" max="60" step="5"></div></label>
      <label><span>Carbs per hour</span><div class="inline"><button data-step="-5" data-target="swimCPH">-</button><input id="swimCPH" type="number" value="80"><button data-step="5" data-target="swimCPH">+</button></div></label>
    </fieldset>

    <fieldset>
      <legend>Bike</legend>
      <label><span>Duration (min)</span><div class="inline"><input id="bikeMinutes" type="number" value="0"><input id="bikeSlider" type="range" min="0" max="300" step="5"></div></label>
      <label><span>Carbs per hour</span><div class="inline"><button data-step="-5" data-target="bikeCPH">-</button><input id="bikeCPH" type="number" value="80"><button data-step="5" data-target="bikeCPH">+</button></div></label>
      <label><span># Carb bottles</span><input id="numCarbBottles" type="number" value="1"></label>
    </fieldset>

    <fieldset>
      <legend>Run</legend>
      <label><span>Duration (min)</span><div class="inline"><input id="runMinutes" type="number" value="0"><input id="runSlider" type="range" min="0" max="120" step="5"></div></label>
      <label><span>Carbs per hour</span><div class="inline"><button data-step="-5" data-target="runCPH">-</button><input id="runCPH" type="number" value="80"><button data-step="5" data-target="runCPH">+</button></div></label>
    </fieldset>
  </div>

  <details>
    <summary><strong>Advanced settings</strong></summary>
    <label><span>Max carbs per bottle (g)</span><input id="maxBottleCarbs" type="number" value="120"></label>
    <label><span>Mix ratio G</span><input id="G" type="number" step="0.1" value="1"></label>
    <label><span>Mix ratio F</span><input id="F" type="number" step="0.1" value="0.8"></label>
    <label><span>Sodium target (mg/h)</span><input id="targetSodiumPerHour" type="number" value="700"></label>
    <label><span>Sodium per scoop</span><input id="sodiumPerScoop" type="number" value="5000"></label>
    <label><span>Run max gel size (g)</span><input id="runMaxGel" type="number" value="30"></label>
    <label><span>Prefer larger gels</span><input id="bikePreferLarge" type="checkbox" checked></label>
    <label><span>Expiry horizon (days)</span><input id="expiryHorizonDays" type="number"></label>
  </details>

  <button class="primary" id="btnCalc">Calculate</button>

  <!-- Inventory section unchanged -->
</main>

<script src="sync.js?v=7"></script>
<script src="inventory.v2.js?v=7"></script>
<script src="app.v3.js?v=7"></script>
</body>
</html>
