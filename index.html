
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <title>Bike Fuel Planner</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --brand:#0b57d0;
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#0d1321;
      --muted:#64748b;
    }

    * { box-sizing:border-box }

    body {
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--ink);
    }

    header {
      padding:14px 16px;
      background:var(--brand);
      color:#fff;
      position:sticky;
      top:0;
    }

    h1 { margin:0; font-size:1.125rem }

    main {
      max-width:980px;
      margin:16px auto;
      padding:0 12px;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media (max-width:720px) {
      .grid { grid-template-columns:1fr }
    }

    fieldset {
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:var(--card);
      padding:12px;
    }

    legend {
      padding:0 6px;
      color:var(--muted);
    }

    label {
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      margin:8px 0;
    }

    input[type=number] {
      width:100px;
      text-align:right;
      padding:8px;
      border:1px solid #c7d0e0;
      border-radius:8px;
    }

    input[type=range] { flex:1 }

    .inline {
      display:flex;
      gap:8px;
      align-items:center;
    }

    button.primary {
      width:100%;
      background:var(--brand);
      color:#fff;
      border:0;
      border-radius:12px;
      padding:14px 18px;
      font-weight:600;
      margin:16px 0;
      font-size:1.05rem;
    }

    .ghost {
      background:#1f2937;
      color:#e5e7eb;
      border:1px solid #374151;
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
    }

    /* ===== Overlay ===== */
    #overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.25);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:12px;
    }

    #overlay.show { display:flex }

    #card {
      background:#fff;
      border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,0.45);
      max-width:700px;
      width:100%;
      max-height:calc(100vh - 24px);
      display:flex;
      flex-direction:column;
    }

    .modal-header {
      background:var(--brand);
      color:#fff;
      padding:12px 16px;
      position:sticky;
      top:0;
      z-index:1;
    }

    #close {
      position:absolute;
      top:8px;
      right:8px;
      width:32px;
      height:32px;
      border-radius:50%;
      border:none;
      background:rgba(255,255,255,0.2);
      color:white;
      font-size:20px;
      cursor:pointer;
    }

    #content { padding:14px; overflow-y:auto }

    .row {
      background:#f6f7fb;
      border:1px solid #e5e7eb;
      border-radius:10px;
      padding:10px;
      margin-bottom:10px;
    }

    /* ===== SUMMARY GRID ===== */
    .summary-grid {
      display:grid;
      grid-template-columns:
        1.2fr   /* Discipline */
        1fr     /* Duration */
        1fr     /* Target */
        1.8fr   /* Gels */
        1fr     /* Bottles */
        1fr     /* Total */
        0.6fr;  /* Edit */
      gap:6px 12px;
      align-items:center;
    }

    .summary-grid.header {
      font-weight:600;
      color:#475569;
      font-size:0.85rem;
      border-bottom:1px solid #e5e7eb;
      padding-bottom:6px;
      margin-bottom:6px;
    }

    .summary-grid.row {
      background:#f8fafc;
      border-radius:8px;
      padding:8px 10px;
    }

    .summary-grid.total {
      border-top:2px solid #c7d7ff;
      margin-top:8px;
      padding-top:8px;
      font-weight:700;
    }

    .summary-cell.center { text-align:center }

    .edit-btn {
      font-size:14px;
      padding:6px 8px;
    }
  </style>
</head>

<body>
<header><h1>Bike Fuel Planner</h1></header>

<main>
  <!-- Inputs unchanged -->
</main>

<div id="overlay" role="dialog" aria-modal="true">
  <div id="card">
    <div class="modal-header">
      <h2>Fuel Plan Summary</h2>
      <button id="close">×</button>
    </div>

    <div id="content">
      <div class="row" id="sSummary"></div>
      <div class="row" id="sSummaryTotal"></div>
      <div class="row" id="sOverview"></div>
      <div class="row" id="sInv"></div>
    </div>
  </div>
</div>

<script src="sync.js"></script>
<script src="inventory.js"></script>
<script src="app.js"></script>
</body>
</html>
