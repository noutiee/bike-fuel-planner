
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <title>Bike Fuel Planner</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --brand:#0b57d0;
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#0d1321;
      --muted:#64748b;
    }

    * { box-sizing:border-box }

    body {
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      margin:0;
      background:var(--bg);
      color:var(--ink);
    }

    header {
      padding:14px 16px;
      background:var(--brand);
      color:#fff;
      position:sticky;
      top:0;
      z-index:10;
    }

    h1 { margin:0; font-size:1.125rem }

    main {
      max-width:980px;
      margin:16px auto;
      padding:0 12px;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media (max-width:720px) {
      .grid { grid-template-columns:1fr }
    }

    fieldset {
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:var(--card);
      padding:12px;
    }

    legend { color:var(--muted) }

    label {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin:8px 0;
    }

    input[type=number] {
      width:100px;
      text-align:right;
      padding:8px;
      border:1px solid #c7d0e0;
      border-radius:8px;
    }

    input[type=range] { flex:1 }

    .inline {
      display:flex;
      gap:8px;
      align-items:center;
    }

    button.primary {
      display:block;
      width:100%;
      background:var(--brand);
      color:#fff;
      border:0;
      border-radius:12px;
      padding:14px;
      margin:16px 0;
      font-weight:600;
      cursor:pointer;
    }

    .ghost {
      background:#1f2937;
      color:#e5e7eb;
      border:1px solid #374151;
      border-radius:10px;
      padding:10px 12px;
      cursor:pointer;
    }

    details {
      border:1px dashed #cbd5e1;
      border-radius:10px;
      padding:10px;
      background:#fff;
      margin-top:12px;
    }

    /* ================= OVERLAY (FIXED ONLY) ================= */

    #overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    #overlay.show { display:flex }

    #card {
      background:#ffffff;
      width:100%;
      max-width:540px;
      border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,0.45);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .modal-header {
      background:#0b57d0;
      color:#ffffff;
      padding:12px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .modal-header h2 {
      margin:0;
      font-size:1.05rem;
    }

    #close {
      all:unset;
      cursor:pointer;
      font-size:24px;
      color:#fff;
    }

    #content {
      padding:14px;
      max-height:65vh;
      overflow-y:auto;
    }

    .row {
      background:#f6f7fb;
      border:1px solid #e5e7eb;
      border-radius:10px;
      padding:10px;
      margin-bottom:8px;
      font-size:0.95rem;
    }

    #sInv h3 {
      margin:8px 0 4px;
      color:#0b57d0;
      font-size:0.95rem;
    }
  </style>
</head>

<body>

<header>
  <h1>Bike Fuel Planner</h1>
</header>

<div style="margin:12px; display:flex; gap:8px; align-items:center;">
  <button class="ghost" id="btnSignIn" onclick="signIn()">Sign in with Google</button>
  <button class="ghost" id="btnSignOut" onclick="signOut()" style="display:none;">Sign out</button>
  <span id="signedInAs" style="color:#64748b;"></span>
  <button class="ghost" id="btnForcePull" type="button" style="margin-left:auto; display:none;">
    Force sync (pull)
  </button>
</div>

<main>

  <!-- YOUR EXISTING PLANNER + INVENTORY CONTENT STAYS EXACTLY THE SAME -->
  <!-- (Everything you pasted above lives here unchanged) -->

</main>

<!-- ================= SAFE, CLEAN OVERLAY ================= -->
<div id="overlay" role="dialog" aria-modal="true">
  <div id="card">

    <div class="modal-header">
      <h2>Fuel Plan Summary</h2>
      <button id="close" aria-label="Close">×</button>
    </div>

    <div id="content">
      <div class="row" id="s1"></div>
      <div class="row" id="s2"></div>
      <div class="row" id="s3"></div>
      <div class="row" id="s4"></div>
      <div class="row" id="s5"></div>
      <div class="row" id="sInv"></div>
    </div>

  </div>
</div>

<!-- App scripts -->
<script src="sync.js"></script>
<script src="inventory.js"></script>
<script src="app.js"></script>

</body>
</html>
