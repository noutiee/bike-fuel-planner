<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b57d0">
<title>Bike Fuel Planner</title>
<style>
  :root{--brand:#0b57d0;--bg:#f6f7fb;--card:#ffffff;--ink:#0d1321;--muted:#64748b}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{padding:14px 16px;background:var(--brand);color:#fff;position:sticky;top:0}
  h1{font-size:1.125rem;margin:0}
  main{max-width:820px;margin:16px auto;padding:0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:720px){.grid{grid-template-columns:1fr}}
  fieldset{border:1px solid #e5e7eb;border-radius:10px;background:var(--card);padding:12px}
  legend{padding:0 6px;color:var(--muted)}
  label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
  label span{font-size:0.95rem}
  input{width:130px;text-align:right;padding:8px 10px;border:1px solid #c7d0e0;border-radius:8px;background:#fff}
  button.primary{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:600;margin:16px 0;font-size:1.05rem}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* Modal overlay and card - improved */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 9999;
  }
  #overlay.show { display: flex; }
  #card {
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    background: #111827;
    color: #f9fafb;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
  }
  #card header {
    background: transparent;
    color: #f9fafb;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: static;
  }
  #close {
    position: absolute;
    right: 10px;
    top: 10px;
    background: transparent;
    border: 0;
    color: #cbd5e1;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
  }
  /* Make just the content area scrollable! Keeps actions/buttons visible. */
  #content {
    padding: 12px;
    overflow-y: auto;
    max-height: 60vh;
  }
  .row{background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin:8px 0}
  .actions{display:flex;gap:8px;justify-content:flex-end;padding:0 12px 12px}
  .ghost{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:10px;padding:10px 12px}
  @media (max-width: 600px) {
    #card {
      max-width: 99vw;
      max-height: 98vh;
    }
    #content {
      max-height: 55vh;
      padding: 8px;
    }
  }
</style>
<body>
<header>
  <h1>Bike Fuel Planner</h1>
</header>
<main>
  <div class="grid">
    <fieldset>
      <legend>Ride & Targets</legend>
      <label><span>Ride duration (h)</span><input id="rideHours" type="number" step="0.25" value="5" inputmode="decimal"></label>
      <label><span>Carbs per hour (g/h)</span><input id="carbsPerHour" type="number" step="1" value="80"></label>
      <label><span># carb bottles</span><input id="numCarbBottles" type="number" step="1" value="2"></label>
      <label><span>Max carbs per bottle (g)</span><input id="maxBottleCarbs" type="number" step="1" value="120"></label>
    </fieldset>

    <fieldset>
      <legend>Gels</legend>
      <label><span>Large gel (g)</span><input id="largeGel" type="number" step="1" value="40"></label>
      <label><span>Medium gel (g)</span><input id="mediumGel" type="number" step="1" value="30"></label>
      <label><span>Small gel (g)</span><input id="smallGel" type="number" step="1" value="22"></label>
    </fieldset>

    <fieldset>
      <legend>Mix ratio</legend>
      <label><span>G part (malto)</span><input id="G" type="number" step="0.1" value="1"></label>
      <label><span>F part (fructose)</span><input id="F" type="number" step="0.1" value="0.8"></label>
      <label><span>Malto carb fraction (%)</span><input id="maltoFrac" type="number" step="1" value="95"></label>
      <label><span>Fructose carb fraction (%)</span><input id="fructoseFrac" type="number" step="1" value="100"></label>
    </fieldset>

    <fieldset>
      <legend>Electrolytes</legend>
      <label><span>Sodium per scoop (mg)</span><input id="sodiumPerScoop" type="number" step="100" value="5000"></label>
      <label><span>Target sodium (mg/h)</span><input id="targetSodiumPerHour" type="number" step="50" value="700"></label>
    </fieldset>
  </div>

  <button class="primary" id="btnCalc">Calculate</button>
</main>

<!-- Modal overlay -->
<div id="overlay" role="dialog" aria-modal="true">
  <div id="card">
    <header>
      <h1>Fuel Plan Summary</h1>
    </header>
    <button id="close" aria-label="Close">✕</button>
    <div id="content">
      <div class="row" id="s1"></div>
      <div class="row" id="s2"></div>
      <div class="row" id="s3"></div>
      <div class="row" id="s4"></div>
      <div class="row" id="s5"></div>
      <div class="row" id="s6"></div>
      <div class="row" id="s7"></div>
      <div class="row" id="s8"></div>
      <div class="row" id="s9"></div>
      <div class="row" id="s10"></div>
      <div class="row" id="s11"></div>
      <div class="row" id="s12"></div>
      <div class="row" id="s13"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="btnCopy">Copy summary</button>
      <button class="ghost" id="btnClose">Close</button>
    </div>
  </div>
</div>

<script>
// Register SW for offline
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}

// IDs
const ids = ["rideHours","carbsPerHour","maxBottleCarbs","numCarbBottles",
             "largeGel","mediumGel","smallGel","G","F",
             "maltoFrac","fructoseFrac","sodiumPerScoop","targetSodiumPerHour"];

const $ = id => document.getElementById(id);

// Calculation (gels round up, then shave bottle surplus)
function calc(){
  const rideHours=parseFloat($("rideHours").value)||0,
        cph=parseFloat($("carbsPerHour").value)||0,
        maxB=parseFloat($("maxBottleCarbs").value)||0,
        nB=parseFloat($("numCarbBottles").value)||0,
        large=parseFloat($("largeGel").value)||0,
        medium=parseFloat($("mediumGel").value)||0,
        small=parseFloat($("smallGel").value)||0,
        G=parseFloat($("G").value)||0,
        F=parseFloat($("F").value)||0,
        maltoFrac=(parseFloat($("maltoFrac").value)||0)/100,
        fructoseFrac=(parseFloat($("fructoseFrac").value)||0)/100,
        NaPer=parseFloat($("sodiumPerScoop").value)||0,
        NaH=parseFloat($("targetSodiumPerHour").value)||0;

  const total = rideHours * cph;
  const inBottlesRaw = Math.min(nB*maxB, total);
  const gelsRequired = Math.max(0, total - inBottlesRaw);

  const nLarge = (large>0)? Math.floor(gelsRequired/large) : 0;
  let rem = gelsRequired - nLarge*large;
  const nMedium = (medium>0)? Math.floor(rem/medium) : 0;
  rem -= nMedium*medium;
  const nSmall = (small>0 && rem>0)? Math.ceil(rem/small) : 0;

  const gelsActual = nLarge*large + nMedium*medium + nSmall*small;
  const surplus = Math.max(0, gelsActual - gelsRequired);
  const inBottlesAdj = Math.max(0, inBottlesRaw - surplus);

  const parts = G+F;
  const fructoseCarbs = parts ? inBottlesAdj * F / parts : 0;
  const maltoCarbs = parts ? inBottlesAdj * G / parts : 0;

  const fructosePowder = fructoseFrac ? fructoseCarbs / fructoseFrac : 0;
  const maltoPowder = maltoFrac ? maltoCarbs / maltoFrac : 0;
  const totalPowder = fructosePowder + maltoPowder;

  const totalSodium = rideHours * NaH;
  const scoops = NaPer ? totalSodium / NaPer : 0;

  const actual = inBottlesAdj + gelsActual;
  const dev = total ? (100*(actual-total)/total) : 0;

  return {
    rideHours,cph,nB,maxB,large,medium,small,G,F,maltoFrac,fructoseFrac,NaPer,NaH,
    total,inBottlesRaw,gelsRequired,nLarge,nMedium,nSmall,gelsActual,surplus,inBottlesAdj,
    fructosePowder,maltoPowder,totalPowder,totalSodium:scoops*NaPer,scoops,actual,dev
  };
}

function round(x,d){const p=Math.pow(10,d||0);return (Math.round((x+Number.EPSILON)*p)/p).toFixed(d||0)}

function buildSummary(o){
  const lines = [
    `Ride duration: ${round(o.rideHours,2)} h`,
    `Carbs per hour: ${round(o.cph,0)} g/h`,
    `Carb bottles: ${o.nB}`,
    `Malto (per bottle): ${round(o.nB? o.maltoPowder/o.nB : 0,0)} g`,
    `Fructose (per bottle): ${round(o.nB? o.fructosePowder/o.nB : 0,0)} g`,
    `Evolytes (per bottle): ${round(o.nB? o.scoops/o.nB : 0,2)} scoops`,
    `Total carbs per bottle: ${round(o.nB? o.inBottlesAdj/o.nB : 0,0)} g`,
    `Take with you — Large gels: ${o.nLarge}`,
    `Take with you — Medium gels: ${o.nMedium}`,
    `Take with you — Small gels: ${o.nSmall}`,
    `Total carbs (plan): ${round(o.actual,0)} g`,
    `Δ vs target: ${round(o.dev,1)}%`
  ];
  return lines.join('\n');
}

function showSummary(){
  const o = calc();
  const rows = [
    `Ride duration: ${round(o.rideHours,2)} h`,
    `Carbs per hour: ${round(o.cph,0)} g/h`,
    `Carb bottles: ${o.nB}`,
    `Malto (per bottle): ${round(o.nB? o.maltoPowder/o.nB : 0,0)} g`,
    `Fructose (per bottle): ${round(o.nB? o.fructosePowder/o.nB : 0,0)} g`,
    `Evolytes (per bottle): ${round(o.nB? o.scoops/o.nB : 0,2)} scoops`,
    `Total carbs per bottle: ${round(o.nB? o.inBottlesAdj/o.nB : 0,0)} g`,
    `Take with you — Large gels: ${o.nLarge}`,
    `Take with you — Medium gels: ${o.nMedium}`,
    `Take with you — Small gels: ${o.nSmall}`,
    `Total carbs (plan): ${round(o.actual,0)} g`,
    `Δ vs target: ${round(o.dev,1)}%`,
    `\nTap Copy to put this summary on your clipboard.`
  ];
  const ids = ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13'];
  ids.forEach((id,i)=>{ $(id).textContent = rows[i] || ''});
  const overlay = $("overlay");
  overlay.classList.add('show');
  // Store text for copy
  overlay.dataset.summary = buildSummary(o);
}

$("btnCalc").addEventListener('click', showSummary);
$("btnClose").addEventListener('click', ()=>$("overlay").classList.remove('show'));
$("close").addEventListener('click', ()=>$("overlay").classList.remove('show'));

// Copy to clipboard
$("btnCopy").addEventListener('click', ()=>{
  const t = $("overlay").dataset.summary || '';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(()=>alert('Summary copied')).catch(()=>fallback());
  } else {
    fallback();
  }
  function fallback(){
    // Create temporary textarea
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('Summary copied'); }
    catch(e){ alert('Copy failed. Long-press to select text.'); }
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>
