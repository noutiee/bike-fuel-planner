
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b57d0">
  <title>Bike Fuel Planner</title>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#f6f7fb; margin:0 }
    header { background:#0b57d0; color:#fff; padding:12px }
    main { max-width:960px; margin:0 auto; padding:12px }
    fieldset { background:#fff; border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:12px }
    legend { color:#555; padding:0 6px }
    label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0 }
    .inline { display:flex; align-items:center; gap:6px }
    input[type=number] { width:90px }
    input[type=range] { flex:1 }
    button.primary { width:100%; padding:14px; font-size:1.1rem; background:#0b57d0; color:#fff; border:0; border-radius:10px }
    details { background:#fff; border:1px dashed #ccc; border-radius:8px; padding:8px }
  </style>
</head>
<body>
<header><h1>Triathlon Fuel Planner</h1></header>
<main>

  <fieldset>
    <legend>Swim</legend>
    <label><span>Duration (min)</span><div class="inline">
      <input id="swimMinutes" type="number" value="0"><input id="swimSlider" type="range" min="0" max="60" step="5"></div></label>
    <label><span>Carbs per hour (g/h)</span><div class="inline">
      <button type="button" data-step="-5" data-target="swimCPH">-</button>
      <input id="swimCPH" type="number" value="80">
      <button type="button" data-step="5" data-target="swimCPH">+</button></div></label>
  </fieldset>

  <fieldset>
    <legend>Bike</legend>
    <label><span>Duration (min)</span><div class="inline">
      <input id="bikeMinutes" type="number" value="0"><input id="bikeSlider" type="range" min="0" max="300" step="5"></div></label>
    <label><span>Carbs per hour (g/h)</span><div class="inline">
      <button type="button" data-step="-5" data-target="bikeCPH">-</button>
      <input id="bikeCPH" type="number" value="80">
      <button type="button" data-step="5" data-target="bikeCPH">+</button></div></label>
    <label><span># Carb bottles</span><input id="numCarbBottles" type="number" value="1"></label>
  </fieldset>

  <fieldset>
    <legend>Run</legend>
    <label><span>Duration (min)</span><div class="inline">
      <input id="runMinutes" type="number" value="0"><input id="runSlider" type="range" min="0" max="120" step="5"></div></label>
    <label><span>Carbs per hour (g/h)</span><div class="inline">
      <button type="button" data-step="-5" data-target="runCPH">-</button>
      <input id="runCPH" type="number" value="80">
      <button type="button" data-step="5" data-target="runCPH">+</button></div></label>
  </fieldset>

  <details>
    <summary><strong>Advanced settings</strong></summary>
    <label><span>Max carbs per bottle</span><input id="maxBottleCarbs" type="number" value="120"></label>
    <label><span>Mix ratio G</span><input id="G" type="number" step="0.1" value="1"></label>
    <label><span>Mix ratio F</span><input id="F" type="number" step="0.1" value="0.8"></label>
    <label><span>Sodium target (mg/h)</span><input id="targetSodiumPerHour" type="number" value="700"></label>
    <label><span>Sodium per scoop</span><input id="sodiumPerScoop" type="number" value="5000"></label>
    <label><span>Run max gel size</span><input id="runMaxGel" type="number" value="30"></label>
    <label><span>Prefer larger bike gels</span><input id="bikePreferLarge" type="checkbox" checked></label>
    <label><span>Expiry horizon (days)</span><input id="expiryHorizonDays" type="number"></label>
  </details>

  <button class="primary" id="btnCalc">Calculate</button>

  <!-- inventory table remains unchanged -->
</main>

<script src="sync.js?v=6"></script>
<script src="inventory.v2.js?v=6"></script>
<script src="app.v3.js?v=6"></script>
</body>
</html>
